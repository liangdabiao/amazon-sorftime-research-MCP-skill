      - 'double (bowl|sink)|depth|divider'
      - 'not included|illustration purposes'
    review_l2:
      - 标称配件与实物不符
      - 尺寸偏大
      - 尺寸偏小
      - 放不下其他清洁工具

# ---------------------------------------------------------------- L1 映射
# 复用 30-insight 的 19 个一级类目，保证三源可对齐。新增类目必须先在这里登记。
l1_axis:
  固定与安装: [吸附牢固, 吸附失效, 安装省事, 安装与说明]
  结构与材质: [材质做工好, 结构断裂, 锈蚀掉漆, 做工与安全]
  收纳与容量: [容量与多功能, 尺寸与容量不适配]
  空间与场景: [省台面空间, 多场景适用, 基材不适配, 使用设计不合理]
  卫生与外观: [快干不易霉, 清洁与霉变, 颜值适配]
  价值: [性价比]
